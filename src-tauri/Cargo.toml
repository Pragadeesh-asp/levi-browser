[package]
name = "levi-browser-foundation"
version = "0.1.0"
description = "LEVI Browser profile isolation proof"
authors = ["LEVI Ecosystem"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
url = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-single-instance = "2"
