[package]
name = "levi-browser-foundation"
version = "0.1.0"
description = "LEVI Browser profile isolation proof"
authors = ["LEVI Ecosystem"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["sync"] }
url = "2"
